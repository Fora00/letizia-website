<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Versioni del sito</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }
    h1 { font-size: 1.5rem; color: #94a3b8; letter-spacing: 0.05em; text-transform: uppercase; font-size: 0.875rem; }
    .versions { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; }
    a {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 2rem 3rem;
      text-decoration: none;
      color: #f1f5f9;
      transition: border-color 0.2s, background 0.2s;
    }
    a:hover { background: #334155; border-color: #6ee7b7; }
    .num { font-size: 3rem; font-weight: 700; color: #6ee7b7; }
    .label { font-size: 0.875rem; color: #94a3b8; }
  </style>
</head>
<body>
  <h1>Seleziona una versione</h1>
  <div class="versions" id="versions"></div>
  <script>
    const versions = [1, 2];
    const base = window.location.pathname.replace(/\/$/, '');
    const container = document.getElementById('versions');
    versions.forEach(v => {
      const a = document.createElement('a');
      a.href = `${base}/${v}/`;
      a.innerHTML = `<span class="num">${v}</span><span class="label">Versione ${v}</span>`;
      container.appendChild(a);
    });
  </script>
</body>
</html>
