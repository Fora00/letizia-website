name: Check for new newsletter posts

on:
  schedule:
    - cron: '0 * * * *'  # every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest posts
        id: fetch
        run: node scripts/fetch-posts.mjs
        continue-on-error: true

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet src/data/newsletter-posts.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated posts
        if: steps.fetch.outcome == 'success' && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/newsletter-posts.json
          git commit -m "chore: update newsletter posts"
          git push
