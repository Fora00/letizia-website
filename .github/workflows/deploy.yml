name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild (Mon 06:00 UTC) so newsletter posts and past-event
    # filtering stay fresh without manual pushes
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Per-ref so PR check runs don't queue behind main deployments
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch newsletter posts
        run: node scripts/fetch-posts.mjs
        continue-on-error: true

      - name: Type check
        run: npx astro check

      - name: Build Astro site
        run: npm run build

      # Serve dist under the GH Pages base path so CSS/assets resolve —
      # pa11y's contrast checks are meaningless on an unstyled page.
      - name: Serve built site
        run: |
          mkdir -p _site/letizia-website
          cp -r dist/* _site/letizia-website/
          python3 -m http.server 8080 --directory _site &
          sleep 2

      # WCAG 2 AA gate over every page in the sitemap. Uses the runner's
      # preinstalled Chrome (skips puppeteer's Chromium download).
      - name: Accessibility gate (pa11y-ci)
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: >
          npx --yes pa11y-ci
          --sitemap http://localhost:8080/letizia-website/sitemap-0.xml
          --sitemap-find "https://fora00.github.io"
          --sitemap-replace "http://localhost:8080"

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
